<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Radio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="radio-app">
      <header class="app-header">
        <a class="brand" href="#" aria-label="Modern Radio — главная">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M4 10v4m4-8v12m4-15v18m4-14v10m4-7v4" />
            </svg>
          </span>
          <span>Modern <strong>Radio</strong></span>
        </a>
        <button class="icon-button" type="button" aria-label="Настройки">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M12 15.25a3.25 3.25 0 1 0 0-6.5 3.25 3.25 0 0 0 0 6.5Z"
            />
            <path
              d="m19.4 15 .04.03a1.8 1.8 0 0 1-2.55 2.55l-.03-.04a1.8 1.8 0 0 0-3.06 1.28v.1a1.8 1.8 0 0 1-3.6 0v-.06a1.8 1.8 0 0 0-3.07-1.28l-.03.04a1.8 1.8 0 1 1-2.55-2.55l.04-.03a1.8 1.8 0 0 0-1.28-3.06h-.1a1.8 1.8 0 0 1 0-3.6h.06a1.8 1.8 0 0 0 1.28-3.07l-.04-.03a1.8 1.8 0 1 1 2.55-2.55l.03.04a1.8 1.8 0 0 0 3.06-1.28v-.1a1.8 1.8 0 0 1 3.6 0v.06a1.8 1.8 0 0 0 3.07 1.28l.03-.04a1.8 1.8 0 1 1 2.55 2.55l-.04.03a1.8 1.8 0 0 0 1.28 3.06h.1a1.8 1.8 0 0 1 0 3.6h-.06A1.8 1.8 0 0 0 19.4 15Z"
            />
          </svg>
        </button>
      </header>

      <section class="now-playing panel" aria-labelledby="now-playing-title">
        <div class="section-heading">
          <span class="eyebrow">СЕЙЧАС ИГРАЕТ</span>
          <span class="live-indicator" id="live-indicator" hidden><span></span> LIVE</span>
        </div>

        <div class="station-feature">
          <div class="cover-art" id="station-cover" role="img" aria-label="Обложка радиостанции">
            <span class="cover-orbit cover-orbit-one"></span>
            <span class="cover-orbit cover-orbit-two"></span>
            <span class="cover-core" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 10v4m4-8v12m4-15v18m4-14v10m4-7v4" />
              </svg>
            </span>
            <span class="cover-caption" id="cover-caption">RADIO</span>
          </div>

          <div class="station-info">
            <div class="station-kicker">ИЗБРАННАЯ СТАНЦИЯ</div>
            <h1 id="now-playing-title">Выберите станцию</h1>
            <p id="now-playing-description">Нажмите на карточку, чтобы начать эфир</p>
            <span class="stream-quality">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M2 6.5a9 9 0 0 1 12 0M4.5 9a5.2 5.2 0 0 1 7 0M7 11.5a1.5 1.5 0 0 1 2 0" />
                <circle cx="8" cy="13.5" r=".7" fill="currentColor" stroke="none" />
              </svg>
              <span id="stream-quality-value">—</span>
              <span class="quality-dot"></span>
              <span id="stream-quality-label">Поток</span>
            </span>
          </div>
        </div>

        <div class="visualizer" role="img" aria-label="Визуализация звука">
          <canvas class="visualizer-canvas" aria-hidden="true"></canvas>
        </div>

        <div class="player-controls">
          <span class="control-caption" id="player-status" role="status" aria-live="polite">Выберите станцию</span>
          <button class="control-caption unlock-audio" id="unlock-audio" type="button" hidden>
            Разблокировать звук
          </button>
          <button class="play-button" id="play-button" type="button" aria-label="Воспроизвести" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M8.2 5.8a1 1 0 0 1 1.52-.85l9.1 5.7a1.6 1.6 0 0 1 0 2.7l-9.1 5.7a1 1 0 0 1-1.52-.85V5.8Z" />
            </svg>
          </button>
          <label class="volume-control">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M11 5 6 9H3v6h3l5 4V5Z" />
              <path d="M15.5 8.5a5 5 0 0 1 0 7m3-10a9 9 0 0 1 0 13" />
            </svg>
            <span class="visually-hidden">Громкость</span>
            <input type="range" id="volume-control" min="0" max="100" value="72" aria-label="Громкость" />
          </label>
        </div>
      </section>

      <section class="stations-section" aria-labelledby="stations-title">
        <div class="stations-heading">
          <div>
            <span class="eyebrow">НА ТВОЕЙ ВОЛНЕ</span>
            <h2 id="stations-title">Станции</h2>
          </div>
          <button class="see-all" type="button">Все <span aria-hidden="true">→</span></button>
        </div>

        <div class="station-grid" id="station-grid" aria-label="Список радиостанций"></div>
      </section>

      <footer class="app-footer">
        <span class="footer-wave" aria-hidden="true">〰</span>
        <span>Твоя музыка. Твоя частота.</span>
        <span class="footer-equalizer" aria-hidden="true"><i></i><i></i><i></i></span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
